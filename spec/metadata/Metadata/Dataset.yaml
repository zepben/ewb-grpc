name: Dataset
description: Represents a set of information described by metadata in a message or in a catalog.
attributes:
- name: businessPurpose
  type: String
  description: Describes the business purpose of the information set, which is usually a string defined by the business process
    that publishes the information set and is often used by business process logic to recognize the purpose of a message.
- name: temporal
  type: DateTimeInterval
  description: |-
    Describes the time or time frame represented by the information set.

    The temporal period that the dataset covers.
- name: version
  type: Integer
  description: Identifies a member of a succession of information sets that have the same purpose but evolve over time.
- name: issued
  type: DateTime
  description: |-
    The date of listing (i.e., formal recording) of the corresponding dataset or service in the catalog.

    This indicates the date of listing the dataset in the catalog and not the publication date of the dataset itself.
- name: authority
  type: String
  description: Identifies the agent that is the model authority for the dataset contents.
ancestors:
- MetaThing
descendants:
- List
- GridDataset
- Message
- Reference
- GridAssembly
- FrameworkEdition
- GridChange
- Attachment
- Frame
- Boundary
- GridProject
- StepSeqiuence
associations:
- source: Dataset
  target: Message
  sourceCardinality: 0..*
  sourceName: contains
  targetCardinality: 1..*
  targetName: publishedIn
- source: Dataset
  target: InputVariable
  sourceCardinality: 1..*
  sourceName: value
  sourceDescription: Was input for this argument of the activity.
  targetCardinality: 0..*
  targetName: usedAs
  targetDescription: Was supplied as input argument to an activity.
- source: Dataset
  target: Distribution
  sourceCardinality: "1"
  sourceName: Dataset
  targetCardinality: 0..*
  targetName: distribution
- source: Dataset
  target: Dataset
  sourceCardinality: 0..1
  sourceName: isReplacedBy
  sourceDescription: target dataset is replaced by source
  targetCardinality: "1"
  targetName: replaces
  targetDescription: source dataset replaces target
- source: Dataset
  target: List
  sourceCardinality: 1..*
  sourceName: contains
  sourceDescription: Dataset item in a list.
  targetCardinality: 0..*
  targetName: containedIn
  targetDescription: List that dataset is mentioned in.
- source: Dataset
  target: Activity
  sourceCardinality: 0..*
  sourceName: generated
  sourceDescription: Identifies a dataset generated by an activity.
  targetCardinality: 0..1
  targetName: wasGeneratedBy
  targetDescription: Identifies the activity that generated the dataset.
- source: Dataset
  target: Attachment
  sourceCardinality: "1"
  sourceName: describes
  sourceDescription: Identifies the Dataset that the attachment adds information about.
  targetCardinality: 0..*
  targetName: attachment
  targetDescription: Attachments to a dataset.