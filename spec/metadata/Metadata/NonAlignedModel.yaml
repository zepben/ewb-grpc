name: NonAlignedModel
description: |-
  GridModels that are not aligned with any framework part shall be represented as non-aligned.



  When frameworks are not being used, all models are either non-aligned or assembly wide, and procedures that use the modeling need to know how to put them together by other means.



  When modeling is being imported into a framework structure, the modeling is usually received as non-aligned and then operated on to extract and save framework parts.
ancestors:
- GridModel