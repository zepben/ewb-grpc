name: Activity
description: |-
  Documents the manual or automated process step that produces a Dataset. If the activity is executed by invoking a procedure or function with defined arguments, then the arguments are referenced by the activity, creating a trail of provenance.



  Business process design may specify how to document activity. In the absence of a business process specification, documentation is at the producer's discretion.
attributes:
- name: function
  type: String
  description: The name of a defined function that has been executed. This may identify a function that has been formally
    defined in a message specification with named parameters and dataset arguments.
- name: agent
  type: String
  description: The entity that executed an activity.
ancestors:
- MetaThing
- Agent
associations:
- source: Activity
  target: InputParameter
  sourceCardinality: "1"
  sourceName: wasInputTo
  sourceDescription: Was supplied as an input parameter.
  targetCardinality: 0..*
  targetName: argument
  targetDescription: Was invoked with this input parameter.
- source: Activity
  target: InputVariable
  sourceCardinality: "1"
  sourceName: argumentOf
  sourceDescription: Is an input argument to the activity's function specification.
  targetCardinality: 0..*
  targetName: input
  targetDescription: Is invoked with a input variable representing a dataset.
- source: Activity
  target: Dataset
  sourceCardinality: 0..1
  sourceName: wasGeneratedBy
  sourceDescription: Identifies the activity that generated the dataset.
  targetCardinality: 0..*
  targetName: generated
  targetDescription: Identifies a dataset generated by an activity.