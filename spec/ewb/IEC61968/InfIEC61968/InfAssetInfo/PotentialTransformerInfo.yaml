name: PotentialTransformerInfo
description: Properties of potential transformer asset.
attributes:
  - name: accuracyClass
    type: String
    nullable: true
  - name: nominalRatio
    type: Ratio
    nullable: true
  - name: primaryRatio
    type: Float
    description: Ratio for the primary winding tap changer (numerator).
    nullable: true
  - name: ptClass
    type: String
    nullable: true
  - name: ratedVoltage
    type: Double
    description: Rated voltage on the primary side in volts.
    nullable: true
  - name: secondaryRatio
    type: Float
    description: Ratio for the secondary winding tap changer (denominator).
    nullable: true
ancestors:
  - AssetInfo
