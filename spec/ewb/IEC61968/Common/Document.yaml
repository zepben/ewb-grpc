name: Document
description: >-
  Parent class for different groupings of information collected and managed as a part of a business process. It will
  frequently contain references to other objects, such as assets, people and power system resources.
attributes:
  - name: authorName
    type: String
    description: Name of the author of this document.
    nullable: true
  - name: comment
    type: String
    description: Free text comment.
    nullable: true
  - name: createdDateTime
    type: DateTime
    description: Date and time that this document was created.
    nullable: true
  - name: status
    type: String
    description: >-
      Status of subject matter (e.g., Agreement, Work) this document represents. For status of the document itself, use
      'docStatus' attribute.
    nullable: true
  - name: title
    type: String
    description: Document title.
    nullable: true
  - name: type
    type: String
    description: >-
      Utility-specific classification of this document, according to its corporate standards, practices, and existing IT
      systems (e.g., for management of assets, maintenance, work, outage, customers, etc.).
    nullable: true
ancestors:
  - IdentifiedObject
descendants:
  - Agreement
  - OperationalRestriction
  - PricingStructure
  - Tariff
