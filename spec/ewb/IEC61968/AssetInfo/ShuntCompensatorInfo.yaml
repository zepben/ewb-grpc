name: ShuntCompensatorInfo
description: Properties of shunt capacitor, shunt reactor or switchable bank of shunt capacitor or reactor assets.
attributes:
  - name: maxPowerLoss
    type: Integer
    description: Maximum allowed apparent power loss in volt-amperes.
    nullable: true
  - name: ratedCurrent
    type: Double
    description: Rated current in amperes.
    nullable: true
  - name: ratedReactivePower
    type: Double
    description: Rated reactive power in volt-amperes reactive.
    nullable: true
  - name: ratedVoltage
    type: Double
    description: Rated voltage in volts.
    nullable: true
ancestors:
  - AssetInfo
