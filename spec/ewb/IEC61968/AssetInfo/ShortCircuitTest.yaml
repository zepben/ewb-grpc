name: ShortCircuitTest
description: >-
  Short-circuit test results determine mesh impedance parameters. They include load losses and leakage impedances. For
  three-phase windings, the excitation can be a positive sequence (the default) or a zero sequence. There shall be at
  least one grounded winding.
attributes:
  - name: current
    type: Double
    description: Short circuit current in amperes.
    nullable: true
  - name: energisedEndStep
    type: Integer
    description: Tap step number for the energised end of the test pair.
    nullable: true
  - name: groundedEndStep
    type: Integer
    description: Tap step number for the grounded end of the test pair.
    nullable: true
  - name: leakageImpedance
    type: Double
    description: Leakage impedance measured from a positive-sequence or single-phase short-circuit test in ohms.
    nullable: true
  - name: leakageImpedanceZero
    type: Double
    description: Leakage impedance measured from a zero-sequence short-circuit test in ohms.
    nullable: true
  - name: loss
    type: Integer
    description: Load losses from a positive-sequence or single-phase short-circuit test in watts.
    nullable: true
  - name: lossZero
    type: Integer
    description: Load losses from a zero-sequence short-circuit test in watts.
    nullable: true
  - name: power
    type: Integer
    description: Short circuit apparent power in volt-amperes.
    nullable: true
  - name: voltage
    type: Double
    description: Short circuit voltage as a percentage, expressed as a value between 0 and 1.
    nullable: true
  - name: voltageOhmicPart
    type: Double
    description: Short Circuit Voltage – Ohmic Part.
    nullable: true
ancestors:
  - TransformerTest
