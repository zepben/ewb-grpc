name: WireInsulationKind
type: enum
description: Kind of wire insulation.
attributes:
  - name: asbestosAndVarnishedCambric
    type: enum
    description: Asbestos and varnished cambric wire insulation.
  - name: beltedPilc
    type: enum
    description: Belted pilc wire insulation.
  - name: butyl
    type: enum
    description: Butyl wire insulation.
  - name: crosslinkedPolyethylene
    type: enum
    description: Crosslinked polyethylene wire insulation.
  - name: crosslinkedPolyethyleneWithHelicallyWoundCopperScreen
    type: enum
    description: \[ZBEX\] Cross-Linked Polyethylene (xlpe) with helically wound copper screen
  - name: crosslinkedPolyethyleneWithWavewoundAluminiumScreen
    type: enum
    description: \[ZBEX\] Cross-Linked Polyethylene (xlpe), wavewound aluminium screen
  - name: doubleInsulatedNeutralScreened
    type: enum
    description: >-
      \[ZBEX\] Stranded copper conductor, p.v.c. insulated, copper neutral screen, p.v.c.-insulating sheath overall.
      (Double insulated neutral screened)
  - name: doubleWireArmour
    type: enum
    description: \[ZBEX\] Serving (or bedding) double wire armour
  - name: doubleWireArmourWithPolyvinylChlorideSheath
    type: enum
    description: \[ZBEX\] Double wire armoured PVC outer sheath
  - name: ethylenePropyleneRubber
    type: enum
    description: Ethylene propylene rubber wire insulation.
  - name: ethylenePropyleneRubberStrandedCopperConductor
    type: enum
    description: \[ZBEX\] Stranded copper, Ethylene Propylene Rubber conductor insulation
  - name: ethylenePropyleneRubberWithHelicallyWoundCopperScreen
    type: enum
    description: \[ZBEX\] Ethylene Propylene Rubber conductor insulation, helically wound copper screen
  - name: highMolecularWeightPolyethylene
    type: enum
    description: High nolecular weight polyethylene wire insulation.
  - name: highPressureFluidFilled
    type: enum
    description: High pressure fluid filled wire insulation.
  - name: lowCapacitanceRubber
    type: enum
    description: Low capacitance rubber wire insulation.
  - name: NONE
    type: enum
    description: \[ZBEX\] No insulation.
  - name: oilPaper
    type: enum
    description: Oil paper wire insulation.
  - name: other
    type: enum
    description: Other kind of wire insulation.
  - name: ozoneResistantRubber
    type: enum
    description: Ozone resistant rubber wire insulation.
  - name: paperWithLeadAlloySheath
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath
  - name: paperWithLeadAlloySheathAndPvcOuterSheathScreenedHochstadterConstruction
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath, P.V.C outer sheath, Screened(Hochstadter) construction
  - name: paperWithLeadAlloySheathSingleWireArmoured
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath, single wire armoured.
  - name: paperWithLeadAlloySheathSingleWireArmouredBeltedConstruction
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath, single wire armoured, belted construction
  - name: paperWithLeadAlloySheathSingleWireArmouredHessianServed
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath, single wire armoured, Hessian served.
  - name: paperWithLeadAlloySheathSingleWireArmouredWithHighDensityPoluethyleneScreen
    type: enum
    description: >-
      \[ZBEX\] Paper insulated, lead alloy sheath, single wire armoured, High density polyethylene(& pvc/hdpeh
      composite) screen
  - name: paperWithLeadAlloySheathSingleWireArmouredWithWavewoundAluminiumScreen
    type: enum
    description: \[ZBEX\] Paper insulated, lead alloy sheath, single wire armoured, wavewound aluminium screen
  - name: polyvinylChloride
    type: enum
    description: \[ZBEX\] p.v.c (Polyvinyl Chloride)
  - name: polyvinylChlorideWithPolyvinylChlorideScreen
    type: enum
    description: \[ZBEX\] p.v.c (Polyvinyl Chloride) with Polyvinyl Chloride screen
  - name: polyvinylChlorideWithWavewoundCopperScreen
    type: enum
    description: \[ZBEX\] p.v.c (Polyvinyl Chloride) with wavewound copper screen
  - name: rubber
    type: enum
    description: Rubber wire insulation.
  - name: siliconRubber
    type: enum
    description: Silicon rubber wire insulation.
  - name: treeResistantHighMolecularWeightPolyethylene
    type: enum
    description: Tree resistant high molecular weight polyethylene wire insulation.
  - name: treeRetardantCrosslinkedPolyethylene
    type: enum
    description: Tree retardant crosslinked polyethylene wire insulation.
  - name: unbeltedPilc
    type: enum
    description: Unbelted pilc wire insulation.
  - name: UNKNOWN
    type: enum
    description: Unknown insulation kind.
  - name: varnishedCambricCloth
    type: enum
    description: Varnished cambric cloth wire insulation.
  - name: varnishedDacronGlass
    type: enum
    description: Varnished dacron glass wire insulation.
