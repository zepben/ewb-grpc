name: UsagePoint
description: Logical or physical point in the network to which readings or events may be attributed. Used at the place where a physical or virtual meter may be located; however, it is not required that a meter be present.
attributes:
  - name: approvedInverterCapacity
    type: Integer
    description: \[ZBEX\] The approved inverter capacity at this UsagePoint in volt-amperes.
    nullable: true
  - name: connectionCategory
    type: String
    description: A code used to specify the connection category, e.g., low voltage or low pressure, where the usage point is defined.
    nullable: true
  - name: isVirtual
    type: Boolean
    description: If true, this usage point is virtual, i.e., no physical location exists in the network where a meter could be located to collect the meter readings. For example, one may define a virtual usage point to serve as an aggregation of usage for all of a company's premises distributed widely across the distribution territory. Otherwise, the usage point is physical, i.e., there is a logical point in the network where a meter could be located to collect meter readings.
    nullable: true
  - name: phaseCode
    type: PhaseCode
    description: Phase code. Number of wires and specific nominal phases can be deduced from enumeration literal values. For example, ABCN is three-phase, four-wire, s12n (splitSecondary12N) is single-phase, three-wire, and s1n and s2n are single-phase, two-wire.
ancestors:
  - IdentifiedObject
associations:
  - source: UsagePoint
    target: ContactDetails
    targetCardinality: 0..*
    targetName: contacts
    targetDescription: \[ZBEX\] All contact details for this UsagePoint.
  - source: UsagePoint
    target: EndDevice
    sourceCardinality: 0..*
    sourceName: usagePoints
    sourceDescription: Usage point to which this end device belongs.
    targetCardinality: 0..*
    targetName: endDevices
    targetDescription: All end devices at this usage point.
  - source: UsagePoint
    target: Equipment
    sourceCardinality: 0..*
    sourceName: usagePoints
    sourceDescription: All usage points connected to the electrical grid through this equipment.
    targetCardinality: 0..*
    targetName: equipments
    targetDescription: All equipment connecting this usage point to the electrical grid.
  - source: UsagePoint
    target: Location
    targetCardinality: 0..1
    targetName: usagePointLocation
    targetDescription: Location of this usage point.
