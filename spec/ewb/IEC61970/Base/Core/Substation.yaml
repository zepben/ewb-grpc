name: Substation
description: A collection of equipment for purposes other than generation or utilization, through which electric energy in bulk is passed for the purposes of switching or modifying its characteristics.
ancestors:
  - EquipmentContainer
associations:
  - source: Substation
    target: Circuit
    sourceCardinality: 0..*
    sourceName: endSubstations
    sourceDescription: Simplification of the CIM association via Bay to Circuit
    targetCardinality: 0..*
    targetName: circuits
    targetDescription: Simplification of the CIM association via Bay to Substation
  - source: Substation
    target: Loop
    sourceCardinality: 0..*
    sourceName: energizingSubstations
    sourceDescription: The substations that normally energize this loop.
    targetCardinality: 0..*
    targetName: energizedLoops
    targetDescription: The loops that are normally energized by this substation.
  - source: Substation
    target: Feeder
    sourceCardinality: 0..1
    sourceName: normalEnergizingSubstation
    sourceDescription: The substations that are normally energized by the feeder.
    targetCardinality: 0..*
    targetName: feeders
    targetDescription: The feeders that potentially energize the downstream substation. Should be consistent with the associations that describe the naming hierarchy.
  - source: Substation
    target: Loop
    sourceCardinality: 0..*
    sourceName: substations
    sourceDescription: The substations that are currently powered by this loop.
    targetCardinality: 0..*
    targetName: loops
    targetDescription: The loops that are currently energizing this substation.
  - source: Substation
    target: SubGeographicalRegion
    sourceCardinality: 0..*
    sourceName: substations
    sourceDescription: The substations in this sub-geographical region.
    targetCardinality: 0..1
    targetName: subGeographicalRegion
    targetDescription: The SubGeographicalRegion containing the substation.
