name: Terminal
description: An AC electrical connection point to a piece of conducting equipment. Terminals are connected at physical connection
  points called connectivity nodes.
attributes:
- name: phases
  type: PhaseCode
  nullable: false
  description: Represents the normal network phasing condition.
- name: normalPhases
  type: PhaseCode
  nullable: false
  description: Represents the normal network phasing condition. Mirrors the exported Terminal.normalPhases values.
- name: currentPhases
  type: PhaseCode
  nullable: false
  description: Represents the current network phasing condition. Mirrors the exported Terminal.currentPhases values.
- name: tracedPhases
  type: Integer
  description: |
    The traced phase status:
                    |      uint32      |
                    | 16 bits |16 bits |
    Network status: | current | normal |
    Network state phase status:
                   |              16 bits              |
                   | 4 bits | 4 bits | 4 bits | 4 bits |
    Nominal phase: |   N    |    C   | B/Y/s2 | A/X/s1 |
    Each nominal phase (actual phase):
                  |                 4 bits                |
                  |  1 bit  |  1 bit  |  1 bit  |  1 bit  |
    Actual Phase: |    N    |    C    |    B    |    A    |
- name: sequenceNumber
  type: Integer
  nullable: false
  description: This Terminal's sequence number.
- name: normalFeederDirection
  type: FeederDirection
  nullable: false
  description: Stores the direction of the feeder head relative to this terminal in the normal state of the network.
- name: currentFeederDirection
  type: FeederDirection
  nullable: false
  description: Stores the direction of the feeder head relative to this terminal in the current state of the network.
ancestors:
- ACDCTerminal
associations:
- source: Terminal
  target: TopologicalNode
  sourceCardinality: 0..*
  sourceName: Terminal
  sourceDescription:
    The terminals associated with the topological node. This can be used as an alternative to the connectivity
    node path to terminal, thus making it unnecessary to model connectivity nodes in some cases. Note that if
    connectivity nodes are in the model, this association would probably not be used as an input specification.
  targetCardinality: 0..1
  targetName: TopologicalNode
  targetDescription:
    The topological node associated with the terminal. This can be used as an alternative to the connectivity
    node path to topological node, thus making it unnecessary to model connectivity nodes in some cases. Note
    that if connectivity nodes are in the model, this association would probably not be used as an input specification.
- source: Terminal
  target: ConnectivityNode
  sourceCardinality: 0..*
  sourceName: Terminals
  sourceDescription: Terminals interconnected with zero impedance at a this connectivity node.
  targetCardinality: 0..1
  targetName: ConnectivityNode
  targetDescription: The connectivity node to which this terminal connects with zero impedance.
- source: Terminal
  target: ConductingEquipment
  sourceCardinality: 0..*
  sourceName: Terminals
  sourceDescription: Conducting equipment have terminals that may be connected to other conducting equipment terminals via
    connectivity nodes or topological nodes.
  targetCardinality: 0..1
  targetName: ConductingEquipment
  targetDescription: The conducting equipment of the terminal.  Conducting equipment have  terminals that may be connected
    to other conducting equipment terminals via connectivity nodes or topological nodes.
