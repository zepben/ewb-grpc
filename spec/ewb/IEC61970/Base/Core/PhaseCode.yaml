name: PhaseCode
type: enum
description: >-
  An unordered enumeration of phase identifiers.  Allows designation of phases for both transmission and distribution
  equipment, circuits and loads.   The enumeration, by itself, does not describe how the phases are connected together
  or connected to ground.  Ground is not explicitly denoted as a phase.

  Residential and small commercial loads are often served from single-phase, or split-phase, secondary circuits. For the
  example of s12N, phases 1 and 2 refer to hot wires that are 180 degrees out of phase, while N refers to the neutral
  wire. Through single-phase transformer connections, these secondary circuits may be served from one or two of the
  primary phases A, B, and C. For three-phase loads, use the A, B, C phase codes instead of s12N.

  The integer values are from IEC 61968-9 to support revenue metering applications.
attributes:
  - name: A
    type: enum
    description: Phase A.
  - name: AB
    type: enum
    description: Phases A and B.
  - name: ABC
    type: enum
    description: Phases A, B, and C.
  - name: ABCN
    type: enum
    description: Phases A, B, C, and N.
  - name: ABN
    type: enum
    description: Phases A, B, and neutral.
  - name: AC
    type: enum
    description: Phases A and C.
  - name: ACN
    type: enum
    description: Phases A, C and neutral.
  - name: AN
    type: enum
    description: Phases A and neutral.
  - name: B
    type: enum
    description: Phase B.
  - name: BC
    type: enum
    description: Phases B and C.
  - name: BCN
    type: enum
    description: Phases B, C, and neutral.
  - name: BN
    type: enum
    description: Phases B and neutral.
  - name: C
    type: enum
    description: Phase C.
  - name: CN
    type: enum
    description: Phases C and neutral.
  - name: N
    type: enum
    description: Neutral phase.
  - name: none
    type: enum
    description: No phases specified.
  - name: s1
    type: enum
    description: Secondary phase 1.
  - name: s12
    type: enum
    description: Secondary phase 1 and 2.
  - name: s12N
    type: enum
    description: Secondary phases 1, 2, and neutral.
  - name: s1N
    type: enum
    description: Secondary phase 1 and neutral.
  - name: s2
    type: enum
    description: Secondary phase 2.
  - name: s2N
    type: enum
    description: Secondary phase 2 and neutral.
  - name: X
    type: enum
    description: Unknown non-neutral phase.
  - name: XN
    type: enum
    description: Unknown non-neutral phase plus neutral.
  - name: XY
    type: enum
    description: Two unknown non-neutral phases.
  - name: XYN
    type: enum
    description: Two unknown non-neutral phases plus neutral.
  - name: Y
    type: enum
    description: /[ZBEX/] Unknown non-neutral phase.
  - name: YN
    type: enum
    description: /[ZBEX/] Unknown non-neutral phase plus neutral.
