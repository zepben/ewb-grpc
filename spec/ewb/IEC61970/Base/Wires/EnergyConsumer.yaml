name: EnergyConsumer
description: >-
  Generic user of energy - a  point of consumption on the power system model.

  EnergyConsumer.pfixed, .qfixed, .pfixedPct and .qfixedPct have meaning only if there is no LoadResponseCharacteristic
  associated with EnergyConsumer or if LoadResponseCharacteristic.exponentModel is set to False.
attributes:
  - name: customerCount
    type: Integer
    description: Number of individual customers represented by this demand.
    nullable: true
  - name: grounded
    type: Boolean
    description: Used for Yn and Zn connections. True if the neutral is solidly grounded.
    nullable: true
  - name: p
    type: Integer
    description: >-
      Active power of the load in watts. Load sign convention is used, i.e. positive sign means flow out from a node.

      For voltage dependent loads the value is at rated voltage.

      Starting value for a steady state solution.
    nullable: true
  - name: pfixed
    type: Integer
    description: >-
      Active power of the load in watts that is a fixed quantity and does not vary as load group value varies. Load sign
      convention is used, i.e. positive sign means flow out from a node.
    nullable: true
  - name: phaseConnection
    type: PhaseShuntConnectionKind
    description: The type of phase connection, such as wye or delta.
    nullable: false
  - name: q
    type: Double
    description: >-
      Reactive power of the load in volt-amperes reactive. Load sign convention is used, i.e. positive sign means flow
      out from a node.

      For voltage dependent loads the value is at rated voltage.

      Starting value for a steady state solution.
    nullable: true
  - name: qfixed
    type: Double
    description: >-
      Reactive power of the load in volt-amperes reactive that is a fixed quantity and does not vary as load group value
      varies. Load sign convention is used, i.e. positive sign means flow out from a node.
    nullable: true
ancestors:
  - EnergyConnection
associations:
  - source: EnergyConsumer
    target: EnergyConsumerPhase
    sourceCardinality: 0..1
    sourceName: energyConsumer
    sourceDescription: The energy consumer to which this phase belongs.
    targetCardinality: 0..*
    targetName: phases
    targetDescription: The individual phase models for this energy consumer.
