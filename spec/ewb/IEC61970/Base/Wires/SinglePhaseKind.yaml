name: SinglePhaseKind
type: enum
description: >-
  Enumeration of single phase identifiers. Allows designation of single phases for both transmission and distribution
  equipment, circuits and loads.
attributes:
  - name: A
    type: enum
    description: Phase A.
  - name: B
    type: enum
    description: Phase B.
  - name: C
    type: enum
    description: Phase C.
  - name: N
    type: enum
    description: Neutral.
  - name: NONE
    type: enum
    description: no phase specified.
  - name: s1
    type: enum
    description: Secondary phase 1.
  - name: s2
    type: enum
    description: Secondary phase 2.
  - name: X
    type: enum
    description: An unknown primary phase.
  - name: Y
    type: enum
    description: An unknown primary phase.
