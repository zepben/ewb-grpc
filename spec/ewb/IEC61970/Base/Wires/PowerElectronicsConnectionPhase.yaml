name: PowerElectronicsConnectionPhase
description: A single phase of a power electronics connection.
attributes:
  - name: p
    type: Integer
    description: >-
      Active power injection in watts. Load sign convention is used, i.e. positive sign means flow into the equipment
      from the network.
    nullable: true
  - name: phase
    type: SinglePhaseKind
    description: >-
      Phase of this energy producer component.   If the energy producer is wye connected, the connection is from the
      indicated phase to the central ground or neutral point.  If the energy producer is delta connected, the phase
      indicates an energy producer connected from the indicated phase to the next logical non-neutral phase.
    nullable: false
  - name: q
    type: Double
    description: >-
      Reactive power injection in volt-amperes reactive. Load sign convention is used, i.e. positive sign means flow
      into the equipment from the network.
    nullable: true
ancestors:
  - PowerSystemResource
associations:
  - source: PowerElectronicsConnectionPhase
    target: PowerElectronicsConnection
    sourceCardinality: 0..*
    sourceName: phases
    sourceDescription: The individual phases models for the power electronics connection.
    targetCardinality: 0..1
    targetName: powerElectronicsConnection
    targetDescription: Power electronics connection of this power electronics connection phase.
