name: TapChangerControl
description: Describes behaviour specific to tap changers, e.g. how the voltage at the end of a line varies with the load level and compensation of the voltage drop by tap adjustment.
attributes:
  - name: coGenerationEnabled
    type: Boolean
    description: True implies cogeneration mode is enabled and that the control will regulate to the new source bushing (downline bushing), keeping locations downline from experiencing overvoltage situations.
    nullable: true
  - name: forwardLDCBlocking
    type: Boolean
    description: True implies this tap changer turns off/ignores reverse current flows for line drop compensation when power flow is reversed and no reverse line drop is set.
    nullable: true
  - name: limitVoltage
    type: Double
    description: Maximum allowed regulated voltage in volts on the PT secondary, regardless of line drop compensation. Sometimes referred to as first-house protection.
    nullable: true
  - name: lineDropCompensation
    type: Boolean
    description: If true, the line drop compensation is to be applied.
    nullable: true
  - name: lineDropR
    type: Double
    description: Line drop compensator resistance setting in ohms for normal (forward) power flow.
    nullable: true
  - name: lineDropX
    type: Double
    description: Line drop compensator reactance setting in ohms for normal (forward) power flow.
    nullable: true
  - name: reverseLineDropR
    type: Double
    description: Line drop compensator resistance setting in ohms for reverse power flow.
    nullable: true
  - name: reverseLineDropX
    type: Double
    description: Line drop compensator reactance setting in ohms for reverse power flow.
    nullable: true
  - name: timeDelay
    type: Double
    description: The time delay for the tap changer in seconds.
    nullable: true
ancestors:
  - RegulatingControl
