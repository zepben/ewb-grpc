name: AnalogValue
description: AnalogValue represents an analog MeasurementValue.
attributes:
  - name: value
    type: Float
    description: The value to supervise.
    nullable: false
ancestors:
  - MeasurementValue
associations:
  - source: AnalogValue
    target: Analog
    targetCardinality: 0..1
    targetName: analog
    targetDescription: Measurement to which this value is connected.
