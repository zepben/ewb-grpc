name: LvFeeder
description: \[ZBEX\] A branch of LV network starting at a distribution substation and continuing until the end of the LV network.
ancestors:
- EquipmentContainer
associations:
- source: LvFeeder
  target: Terminal
  targetCardinality: 0..1
  targetName: normalHeadTerminal
  targetDescription: \[ZBEX\] The normal head terminal of this LV feeder, typically the LV terminal of a distribution transformer, or the downstream terminal of a LV switch below a distribution transformer.
- source: LvFeeder
  target: Feeder
  sourceCardinality: 0..*
  sourceName: normalEnergizedLvFeeders
  sourceDescription: \[ZBEX\] The LV feeders that are normally energized by the feeder.
  targetCardinality: 0..*
  targetName: normalEnergizingFeeders
  targetDescription: \[ZBEX\] The HV/MV feeders that energize this LV feeder.
- source: LvFeeder
  target: Feeder
  sourceCardinality: 0..*
  sourceName: currentlyEnergizedLvFeeders
  sourceDescription: \[ZBEX\] The LV feeders that are currently energized by the feeder.
  targetCardinality: 0..*
  targetName: currentlyEnergizingFeeders
  targetDescription: \[ZBEX\] The HV/MV feeders that energize this LV feeder in the current state of the network.
- source: LvFeeder
  target: Equipment
  sourceCardinality: 0..*
  sourceName: currentLvFeeders
  sourceDescription: \[ZBEX\] The LV feeders that are normally energized by the feeder.
  targetCardinality: 0..*
  targetName: currentEquipment
  targetDescription: \[ZBEX\] Contained equipment using the current state of the network.
- source: LvFeeder
  target: LvSubstation
  sourceCardinality: 0..*
  sourceName: normalEnergizedLvFeeders
  sourceDescription: \[ZBEX\] The LV feeders that are normally energized by the LvSubstation.
  targetCardinality: 0..1
  targetName: normalEnergizingLvSubstations
  targetDescription: \[ZBEX\] The LvSubstations that nominally energize the LvFeeder. Also used for naming purposes.
