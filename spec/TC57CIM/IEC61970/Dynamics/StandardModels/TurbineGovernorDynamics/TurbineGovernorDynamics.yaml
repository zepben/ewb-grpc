name: TurbineGovernorDynamics
description: >-
  Turbine-governor function block whose behaviour is described by reference to a standard model <font color="#0f0f0f">or
  by definition of a user-defined model.</font>
ancestors:
  - DynamicsFunctionBlock
descendants:
  - GovCT1
  - GovCT2
  - GovGAST
  - GovGAST1
  - GovGAST2
  - GovGAST3
  - GovGAST4
  - GovGASTWD
  - GovHydro1
  - GovHydro2
  - GovHydro3
  - GovHydro4
  - GovHydroDD
  - GovHydroFrancis
  - GovHydroIEEE0
  - GovHydroIEEE2
  - GovHydroPID
  - GovHydroPID2
  - GovHydroPelton
  - GovHydroR
  - GovHydroWEH
  - GovHydroWPID
  - GovSteam0
  - GovSteam1
  - GovSteam2
  - GovSteamBB
  - GovSteamEU
  - GovSteamFV2
  - GovSteamFV3
  - GovSteamFV4
  - GovSteamIEEE1
  - GovSteamSGO
  - TurbineGovernorUserDefined
associations:
  - source: TurbineGovernorDynamics
    target: AsynchronousMachineDynamics
    sourceCardinality: 0..1
    sourceName: turbineGovernorDynamics
    sourceDescription: Turbine-governor model associated with this asynchronous machine model.
    targetCardinality: 0..1
    targetName: asynchronousMachineDynamics
    targetDescription: >-
      Asynchronous machine model with which this turbine-governor model is associated. TurbineGovernorDynamics shall
      have either an association to SynchronousMachineDynamics or to AsynchronousMachineDynamics.
  - source: TurbineGovernorDynamics
    target: SynchronousMachineDynamics
    sourceCardinality: 0..*
    sourceName: turbineGovernorDynamics
    sourceDescription: >-
      Turbine-governor model associated with this synchronous machine model. Multiplicity of greater than one is
      intended to support hydro units that have multiple turbines on one generator.
    targetCardinality: 0..1
    targetName: synchronousMachineDynamics
    targetDescription: >-
      Synchronous machine model with which this turbine-governor model is associated. TurbineGovernorDynamics shall have
      either an association to SynchronousMachineDynamics or to AsynchronousMachineDynamics.
  - source: TurbineGovernorDynamics
    target: TurbineLoadControllerDynamics
    sourceCardinality: "1"
    sourceName: turbineGovernorDynamics
    sourceDescription: Turbine-governor controlled by this turbine load controller.
    targetCardinality: 0..1
    targetName: turbineLoadControllerDynamics
    targetDescription: Turbine load controller providing input to this turbine-governor.
