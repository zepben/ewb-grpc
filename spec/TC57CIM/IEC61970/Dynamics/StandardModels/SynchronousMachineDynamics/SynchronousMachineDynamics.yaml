    sourceDescription: >-
      Synchronous machine dynamics model used to describe dynamic behaviour of this synchronous machine.
    targetCardinality: "1"
    targetName: synchronousMachine
    targetDescription: Synchronous machine to which synchronous machine dynamics model applies.
  - source: SynchronousMachineDynamics
    target: TurbineGovernorDynamics
    sourceCardinality: 0..1
    sourceName: synchronousMachineDynamics
    sourceDescription: >-
      Synchronous machine model with which this turbine-governor model is associated. TurbineGovernorDynamics shall have
      either an association to SynchronousMachineDynamics or to AsynchronousMachineDynamics.
    targetCardinality: 0..*
    targetName: turbineGovernorDynamics
