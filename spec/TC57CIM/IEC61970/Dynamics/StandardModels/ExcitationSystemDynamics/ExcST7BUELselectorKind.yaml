name: ExcST7BUELselectorKind
type: enum
description: Types of connections for the UEL input used for static excitation systems type 7B.
attributes:
  - name: addVref
    type: enum
    description: The signal is added to <i>Vref</i>. Corresponds to <i>UELin</i> = 1 on the ExcST7B diagram.
  - name: inputHVgate
    type: enum
    description: >-
      The signal is connected into the input <i>HVGate</i>.  Corresponds to <i>UELin</i> = 2 on the ExcST7B diagram.
  - name: noUELinput
    type: enum
    description: >-
      No UEL input is used.  Corresponds to <i>UELin</i> not = 1 and not = 2 and not = 3 on the ExcST7B diagram.
      Original ExcST7B model would have called this <i>UELin</i> = 0.
  - name: outputHVgate
    type: enum
    description: >-
      The signal is connected into the output <i>HVGate</i>.  Corresponds to <i>UELin</i> = 3 on the ExcST7B diagram.
