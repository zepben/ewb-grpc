  target: LoadUserDefined
  sourceCardinality: 0..*
  sourceName: proprietaryParameterDynamics
  sourceDescription: Parameter of this proprietary user-defined model.
  targetCardinality: 0..1
  targetName: loadUserDefined
  targetDescription: Proprietary user-defined model with which this parameter is associated.
