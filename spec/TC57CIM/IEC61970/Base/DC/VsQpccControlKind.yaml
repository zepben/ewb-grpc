name: VsQpccControlKind
type: enum
description: Kind of reactive power control at point of common coupling for a voltage source converter.
attributes:
  - name: powerFactorPcc
    type: enum
    description: >-
      Control is power factor at point of common coupling. Target is provided by VsConverter.targetPowerFactorPcc.
  - name: pulseWidthModulation
    type: enum
    description: >-
      No explicit control. Pulse-modulation factor is directly set in magnitude (VsConverter.targetPWMfactor) and phase
      (VsConverter.targetPhasePcc).
  - name: reactivePcc
    type: enum
    description: Control is reactive power at point of common coupling. Target is provided by VsConverter.targetQpcc.
  - name: voltagePcc
    type: enum
    description: Control is voltage at point of common coupling. Target is provided by VsConverter.targetUpcc.
