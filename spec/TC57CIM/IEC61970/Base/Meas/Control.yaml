name: Control
description: >-
  Control is used for supervisory/device control. It represents control outputs that are used to change the state in a
  process, e.g. close or open breaker, a set point value or a raise lower command.
attributes:
  - name: controlType
    type: String
    description: >-
      Specifies the type of Control. For example, this specifies if the Control represents BreakerOpen, BreakerClose,
      GeneratorVoltageSetPoint, GeneratorRaise, GeneratorLower, etc.
  - name: operationInProgress
    type: Boolean
    description: Indicates that a client is currently sending control commands that has not completed.
  - name: timeStamp
    type: DateTime
    description: The last time a control output was sent.
  - name: unitMultiplier
    type: UnitMultiplier
    description: The unit multiplier of the controlled quantity.
  - name: unitSymbol
    type: UnitSymbol
    description: The unit of measure of the controlled quantity.
ancestors:
  - IOPoint
descendants:
  - AccumulatorReset
  - AnalogControl
  - Command
associations:
  - source: Control
    target: ControlAction
    sourceCardinality: 0..1
    sourceName: control
    sourceDescription: The control that the control action is performed on.
    targetCardinality: 0..1
    targetName: controlAction
    targetDescription: The control action that is performed on the control
  - source: Control
    target: PowerSystemResource
    sourceCardinality: 0..*
    sourceName: controls
    sourceDescription: >-
      The controller outputs used to actually govern a regulating device, e.g. the magnetization of a synchronous
      machine or capacitor bank breaker actuator.
    targetCardinality: 0..1
    targetName: powerSystemResource
    targetDescription: Regulating device governed by this control output.
  - source: Control
    target: RemoteControl
    sourceCardinality: "1"
    sourceName: control
    sourceDescription: The Control for the RemoteControl point.
    targetCardinality: 0..1
    targetName: remoteControl
    targetDescription: The remote point controlling the physical actuator.
