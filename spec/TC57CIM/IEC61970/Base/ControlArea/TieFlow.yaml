name: TieFlow
description: A flow specification in terms of location and direction for a control area.
attributes:
- name: positiveFlowIn
  type: Boolean
  description: True if the flow into the terminal (load convention) is also flow into the control area.  For example, this
    attribute should be true if using the tie line terminal further away from the control area. For example to represent a
    tie to a shunt component (like a load or generator) in another area, this is the near end of a branch and this attribute
    would be specified as false.
ancestors:
- IdentifiedObject
associations:
- source: TieFlow
  target: ControlArea
  sourceCardinality: 0..*
  sourceName: tieFlow
  sourceDescription: The tie flows associated with the control area.
  targetCardinality: "1"
  targetName: controlArea
  targetDescription: The control area of the tie flows.
- source: TieFlow
  target: Terminal
  sourceCardinality: 0..2
  sourceName: tieFlow
  sourceDescription: The control area tie flows to which this terminal associates.
  targetCardinality: "1"
  targetName: terminal
  targetDescription: The terminal to which this tie flow belongs.
- source: TieFlow
  target: AltTieMeas
  sourceCardinality: "1"
  sourceName: tieFlow
  sourceDescription: The tie flow of the alternate measurements.
  targetCardinality: 0..*
  targetName: altTieMeas
  targetDescription: The primary and alternate tie flow measurements associated with the tie flow.