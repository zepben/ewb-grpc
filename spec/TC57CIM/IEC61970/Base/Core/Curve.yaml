name: Curve
description: A multi-purpose curve or functional relationship between an independent variable (X-axis) and dependent (Y-axis) variables.
attributes:
  - name: curveStyle
    type: CurveStyle
    description: The style or shape of the curve.
  - name: xMultiplier
    type: UnitMultiplier
    description: Multiplier for X-axis.
  - name: xUnit
    type: UnitSymbol
    description: The X-axis units of measure.
  - name: y1Multiplier
    type: UnitMultiplier
    description: Multiplier for Y1-axis.
  - name: y1Unit
    type: UnitSymbol
    description: The Y1-axis units of measure.
  - name: y2Multiplier
    type: UnitMultiplier
    description: Multiplier for Y2-axis.
  - name: y2Unit
    type: UnitSymbol
    description: The Y2-axis units of measure.
  - name: y3Multiplier
    type: UnitMultiplier
    description: Multiplier for Y3-axis.
  - name: y3Unit
    type: UnitSymbol
    description: The Y3-axis units of measure.
