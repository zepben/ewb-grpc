name: ServiceLocation
description: A real estate location, commonly referred to as premises.
attributes:
  - name: accessMethod
    type: String
    description: >-
      Method for the service person to access this service location. For example, a description of where to obtain a key
      if the facility is unmanned and secured.
  - name: needsInspection
    type: Boolean
    description: >-
      True if inspection is needed of facilities at this service location. This could be requested by a customer, due to
      suspected tampering, environmental concerns (e.g., a fire in the vicinity), or to correct incompatible data.
  - name: siteAccessProblem
    type: String
    description: >-
      Problems previously encountered when visiting or performing work on this location. Examples include: bad dog,
      violent customer, verbally abusive occupant, obstructions, safety hazards, etc.
ancestors:
  - WorkLocation
associations:
  - source: ServiceLocation
    target: Asset
    sourceCardinality: 0..1
    sourceName: serviceLocation
    sourceDescription: The service location at which the assets exist
    targetCardinality: 0..*
    targetName: asset
    targetDescription: All assets that exist at the service location
  - source: ServiceLocation
    target: CustomerAgreement
    sourceCardinality: 0..*
    sourceName: serviceLocations
    sourceDescription: All service locations regulated by this customer agreement.
    targetCardinality: 0..*
    targetName: customerAgreements
    targetDescription: All customer agreements regulating this service location.
  - source: ServiceLocation
    target: EndDevice
    sourceCardinality: 0..1
    sourceName: serviceLocation
    sourceDescription: Service location whose service delivery is measured by this end device.
    targetCardinality: 0..*
    targetName: endDevices
    targetDescription: All end devices that measure the service delivered to this service location.
  - source: ServiceLocation
    target: ServiceRequest
    sourceCardinality: 0..1
    sourceName: serviceLocation
    sourceDescription: The service location for the serivce request
    targetCardinality: 0..*
    targetName: serviceRequest
    targetDescription: All service requests for the service location
  - source: ServiceLocation
    target: TroubleTicket
    sourceCardinality: "1"
    sourceName: serviceLocation
    sourceDescription: The service location to which one or more trouble tickets are associated.
    targetCardinality: 0..*
    targetName: troubleTicket
    targetDescription: The ticket called in by the customer that describes the trouble
  - source: ServiceLocation
    target: UsagePoint
    sourceCardinality: 0..1
    sourceName: serviceLocation
    sourceDescription: Service location where the service delivered by this usage point is consumed.
    targetCardinality: 0..*
    targetName: usagePoints
    targetDescription: All usage points delivering service (of the same type) to this service location.
