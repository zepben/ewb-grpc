name: Customer
description: Organisation receiving services from service supplier.
attributes:
  - name: kind
    type: CustomerKind
    description: Kind of customer.
  - name: locale
    type: String
    description: Locale designating language to use in communications with this customer.
  - name: priority
    type: Priority
    description: Priority of the customer.
  - name: pucNumber
    type: String
    description: (if applicable) Public utilities commission (PUC) identification number.
  - name: specialNeed
    type: String
    description: True if customer organisation has special service needs such as life support, hospitals, etc.
  - name: status
    type: Status
    description: Status of this customer.
  - name: vip
    type: Boolean
    description: >-
      (deprecated) (use 'priority' instead) True if this is an important customer. Importance is for matters different
      than those in 'specialNeed' attribute.
ancestors:
  - OrganisationRole
associations:
  - source: Customer
    target: Customer
    sourceCardinality: 0..1
    sourceName: customer
    sourceDescription: The primary customer that manages the account(s).
    targetCardinality: 0..*
    targetName: customer
    targetDescription: >-
      All customers related to the primary customer.  This may support customer hierarchies. (this can be used to
      support some form of customer containment)
  - source: Customer
    target: CustomerAccount
    sourceCardinality: "1"
    sourceName: customer
    sourceDescription: Customer owning this account.
    targetCardinality: 0..*
    targetName: customerAccounts
    targetDescription: All accounts of this customer.
  - source: Customer
    target: CustomerAgreement
    sourceCardinality: "1"
    sourceName: customer
    sourceDescription: Customer for this agreement.
    targetCardinality: 0..*
    targetName: customerAgreements
    targetDescription: All agreements of this customer.
  - source: Customer
    target: CustomerNotification
    sourceCardinality: 0..1
    sourceName: customer
    sourceDescription: Customer requiring this notification.
    targetCardinality: 0..*
    targetName: customerNotifications
    targetDescription: All notifications required by this customer.
  - source: Customer
    target: EndDevice
    sourceCardinality: 0..1
    sourceName: customer
    sourceDescription: Customer owning this end device.
    targetCardinality: 0..*
    targetName: endDevices
    targetDescription: All end devices of this customer.
  - source: Customer
    target: OldPerson
    sourceCardinality: 0..1
    sourceName: customerData
    targetCardinality: 0..*
    targetName: erpPersons
  - source: Customer
    target: OutagePlan
    sourceCardinality: 0..*
    sourceName: customer
    sourceDescription: The customers that are affected by this planned outage.
    targetCardinality: 0..1
    targetName: outagePlan
    targetDescription: The outage plan that identifies the customers that are affected.
  - source: Customer
    target: Person
    sourceCardinality: 0..*
    sourceName: customer
    sourceDescription: The customer represented by the person
    targetCardinality: 0..*
    targetName: person
    targetDescription: The person representing the customer
  - source: Customer
    target: PlannedOutageNotification
    sourceCardinality: 0..*
    sourceName: customer
    sourceDescription: The customer that receives the notification
    targetCardinality: 0..*
    targetName: plannedOutageNotification
    targetDescription: The notification of the planned outage
  - source: Customer
    target: ServiceRequest
    sourceCardinality: 0..1
    sourceName: customer
    sourceDescription: The customer making the service request
    targetCardinality: 0..*
    targetName: serviceRequest
    targetDescription: All service requests for the customer
  - source: Customer
    target: TroubleTicket
    sourceCardinality: 0..1
    sourceName: customer
    sourceDescription: Customer for whom this trouble ticket is relevant.
    targetCardinality: 0..*
    targetName: troubleTickets
    targetDescription: All trouble tickets for this customer.
  - source: Customer
    target: Work
    sourceCardinality: 0..*
    sourceName: customers
    sourceDescription: All the customers for which this work is performed.
    targetCardinality: 0..*
    targetName: works
    targetDescription: All the works performed for this customer.
