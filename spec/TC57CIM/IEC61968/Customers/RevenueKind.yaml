name: RevenueKind
type: enum
description: >-
  Accounting classification of the type of revenue collected for the customer agreement, typically used to break down
  accounts for revenue accounting.
attributes:
  - name: commercial
    type: enum
    description: Commercial revenue.
  - name: industrial
    type: enum
    description: Industrial revenue.
  - name: irrigation
    type: enum
    description: Irrigation revenue.
  - name: nonResidential
    type: enum
    description: Non-residential revenue.
  - name: other
    type: enum
    description: Other revenue kind.
  - name: residential
    type: enum
    description: Residential revenue.
  - name: streetLight
    type: enum
    description: Streetlight revenue.
