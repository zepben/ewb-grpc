name: ServiceRequestKind
type: enum
description: Kinds of service requests
attributes:
  - name: connect
    type: enum
    description: Physically connect the service.
  - name: construction
    type: enum
    description: The construction work requested.
  - name: disconnect
    type: enum
    description: Physically disconnect the service.
  - name: inspection
    type: enum
    description: Inspection work.
  - name: newservice
    type: enum
    description: A new service is requested by the customer
  - name: other
    type: enum
    description: Other kind of work.
  - name: reconnect
    type: enum
    description: Physically reconnect the service.
  - name: repair
    type: enum
    description: Repair work.
  - name: replace
    type: enum
    description: replace an asset
  - name: test
    type: enum
    description: Test work.
  - name: turn-off
    type: enum
    description: Temporarily turn off the service but leave the connection in place.
  - name: turn-on
    type: enum
    description: Turn on the service.
