name: TransformerFailureReasonKind
type: enum
description: >-
  Reason for transformer failure.

  Note: This enumeration provides essential information to asset health analytics. The existing list is a starting point
  and is anticipated to be fleshed out further as requirements are better understood. (PAB 2016/01/09).
attributes:
  - name: bushingFailure
    type: enum
    description: Bushing-caused failure.
  - name: lossOfOil
    type: enum
    description: Loss-of-oil-caused faliure.
  - name: oilRelatedFailure
    type: enum
    description: Oil-related failure.
  - name: poorOilQuality
    type: enum
    description: Oil quality-related failure.
