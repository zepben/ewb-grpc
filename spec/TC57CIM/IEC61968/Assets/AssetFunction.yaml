name: AssetFunction
description: Function performed by an asset.
attributes:
  - name: configID
    type: String
    description: Configuration specified for this function.
  - name: firmwareID
    type: String
    description: Firmware version.
  - name: hardwareID
    type: String
    description: Hardware version.
  - name: password
    type: String
    description: Password needed to access this function.
  - name: programID
    type: String
    description: Name of program.
ancestors:
  - IdentifiedObject
descendants:
  - EndDeviceFunction
associations:
  - source: AssetFunction
    target: Asset
    sourceCardinality: 0..*
    sourceName: assetFunction
    sourceDescription: Function performed by this asset.
    targetCardinality: 0..1
    targetName: asset
    targetDescription: Asset on which this function can be performed.
