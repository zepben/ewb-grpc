name: AssetModelUsageKind
type: enum
description: Usage for an asset model.
attributes:
- name: customerSubstation
  type: enum
  description: Asset model is intended for use in customer substation.
- name: distributionOverhead
  type: enum
  description: Asset model is intended for use in distribution overhead network.
- name: distributionUnderground
  type: enum
  description: Asset model is intended for use in underground distribution network.
- name: other
  type: enum
  description: Other kind of asset model usage.
- name: streetlight
  type: enum
  description: Asset model is intended for use as streetlight.
- name: substation
  type: enum
  description: Asset model is intended for use in substation.
- name: transmission
  type: enum
  description: Asset model is intended for use in transmission network.
- name: unknown
  type: enum
  description: Usage of the asset model is unknown.
