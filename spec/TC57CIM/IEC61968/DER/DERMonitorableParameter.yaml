name: DERMonitorableParameter
description: >-
  To define the DER monitorable parameters that will be forecasted and dispatched for a DER Group.  Each parameter is
  represented as a Y Value at a point in time or on a curve as a function of time, which is represented on the X axis.
attributes:
  - name: DERParameter
    type: DERParameterKind
    description: Defines the specific engineering value being forecasted or dispatched.
  - name: flowDirection
    type: FlowDirectionKind
    description: >-
      Kind of flow direction for reading/measured  values proper to some commodities such as, for example, energy,
      power, demand.
  - name: yMultiplier
    type: UnitMultiplier
    description: The UnitMultiplier that is applied to the DERMonitorableParameter.
  - name: yUnit
    type: DERUnitSymbol
    description: The DERUnitSymbol that is applied to the DERMonitorableParameter
  - name: yUnitInstalledMax
    type: Float
    description: The maximum value of the DERMonitorableParameter based on the installed capacity.
  - name: yUnitInstalledMin
    type: Float
    description: The minimum value of the DERMonitorableParameter based on the installed capacity.
associations:
  - source: DERMonitorableParameter
    target: DERCurveData
    sourceCardinality: "1"
    sourceName: derMonitorableParameter
    sourceDescription: The DER monitorable parameter for which a time dependent curve has been created.
    targetCardinality: 0..1
    targetName: derCurveData
    targetDescription: Specifies the time dependent curve for a DER monitorable parameter
  - source: DERMonitorableParameter
    target: DispatchSchedule
    sourceCardinality: "1"
    sourceName: derMonitorableParameter
    sourceDescription: The DER monitorable parameter included in the DER dispatch schedule.
    targetCardinality: 0..*
    targetName: dispatchSchedule
    targetDescription: >-
      The schedule used for dispatching or forecasting the values of DER monitorable parameters over time.
  - source: DERMonitorableParameter
    target: EndDeviceGroup
    sourceCardinality: 0..*
    sourceName: derMonitorableParameter
    sourceDescription: The DER monitorable parameters associated with a DER Group.
    targetCardinality: 0..*
    targetName: endDeviceGroup
    targetDescription: The DER Group having DER monitorable parameters.
