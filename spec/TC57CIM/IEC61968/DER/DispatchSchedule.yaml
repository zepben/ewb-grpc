name: DispatchSchedule
description: Specifies the characteristics of the time schedule over which DERMonitorableParameters are dispatched.
attributes:
  - name: confidence
    type: PerCent
    description: >-
      A value set by the system, function, algorithm or person creating a prediction as to how accurate the prediction
      is.
  - name: curveStyleKind
    type: CurveStyle
    description: >-
      Used to specify whether the values over an interval are constant (constantYValue) or linearly interpolated
      (straightLineYValues)
  - name: numberOfIntervals
    type: Integer
    description: Used to specify the number of intervals when requesting a forecast or a dispatch.
  - name: startTime
    type: DateTime
    description: The start time of the first interval in the dispatch schedule
  - name: timeIntervalDuration
    type: Integer
    description: The length of time for each interval in the dispatch schedule.
  - name: timeIntervalUnit
    type: TimeIntervalKind
    description: The unit of measure for the time axis of the dispatch schedule.
associations:
  - source: DispatchSchedule
    target: DERCurveData
    sourceCardinality: 0..1
    sourceName: dispatchSchedule
    sourceDescription: >-
      The schedule used for dispatching or forecasting the values of DER monitorable parameters over time.
    targetCardinality: 0..*
    targetName: derCurveData
    targetDescription: Specifies the time dependent curve for a DER monitorable parameter in the DER dispatch schedule.
  - source: DispatchSchedule
    target: DERMonitorableParameter
    sourceCardinality: 0..*
    sourceName: dispatchSchedule
    sourceDescription: >-
      The schedule used for dispatching or forecasting the values of DER monitorable parameters over time.
    targetCardinality: "1"
    targetName: derMonitorableParameter
    targetDescription: The DER monitorable parameter included in the DER dispatch schedule.
