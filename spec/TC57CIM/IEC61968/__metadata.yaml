name: IEC61968
description: >-
  The IEC 61968 subpackages of the CIM are developed, standardized and maintained by the UCA community including its
  working groups and task forces.

  Currently, normative parts of the model support the needs of information exchange defined in IEC 61968-3, IEC 61968-4,
  IEC 61968-5, IEC 61968-6, IEC 61968-8, IEC 61968-9 and in IEC 61968-13.
