name: Document
description: >-
  Parent class for different groupings of information collected and managed as a part of a business process. It will
  frequently contain references to other objects, such as assets, people and power system resources.
attributes:
  - name: authorName
    type: String
    description: Name of the author of this document.
  - name: comment
    type: String
    description: Free text comment.
  - name: createdDateTime
    type: DateTime
    description: Date and time that this document was created.
  - name: docStatus
    type: Status
    description: >-
      Status of this document. For status of subject matter this document represents (e.g., Agreement, Work), use
      'status' attribute.

      Example values for 'docStatus.status' are draft, approved, cancelled, etc.
  - name: electronicAddress
    type: ElectronicAddress
    description: Electronic address.
  - name: lastModifiedDateTime
    type: DateTime
    description: >-
      Date and time this document was last modified. Documents may potentially be modified many times during their
      lifetime.
  - name: revisionNumber
    type: String
    description: Revision number for this document.
  - name: status
    type: Status
    description: >-
      Status of subject matter (e.g., Agreement, Work) this document represents. For status of the document itself, use
      'docStatus' attribute.
  - name: subject
    type: String
    description: Document subject.
  - name: title
    type: String
    description: Document title.
  - name: type
    type: String
    description: >-
      Utility-specific classification of this document, according to its corporate standards, practices, and existing IT
      systems (e.g., for management of assets, maintenance, work, outage, customers, etc.).
ancestors:
  - IdentifiedObject
descendants:
  - Agreement
  - Analytic
  - AssetGroup
  - AssetModelCatalogueItem
  - AuxiliaryAccount
  - BankAccount
  - BaseWork
  - Bid
  - BillDeterminant
  - BusinessPlan
  - ChargeType
  - CongestionRevenueRight
  - CustomerAccount
  - CustomerBillingInfo
  - EnergyTransaction
  - ErpDocument
  - Incident
  - MarketDocument
  - MarketFactors
  - MarketSkill
  - MarketStatement
  - MerchantAccount
  - MeterReadSchedule
  - OperationalRestriction
  - OperationalTag
  - Outage
  - OutageOrder
  - OutagePlan
  - PassThroughBill
  - PlannedOutageNotification
  - PowerQualityPricing
  - PricingStructure
  - Procedure
  - ProcedureDataSet
  - SafetyDocument
  - ServiceGuarantee
  - Settlement
  - Skill
  - Specification
  - StandardIndustryCode
  - SwitchingOrder
  - SwitchingPlan
  - SwitchingPlanRequest
  - Tariff
  - TariffProfile
  - TimeSchedule
  - TroubleOrder
  - TroubleTicket
  - WorkBillingInfo
  - WorkDocument
  - WorkOrder
  - WorkRequest
associations:
  - source: Document
    target: ActivityRecord
    sourceCardinality: 0..1
    sourceName: document
    sourceDescription: The document having associated activity records
    targetCardinality: 0..*
    targetName: activityRecord
    targetDescription: The activity record for a document
  - source: Document
    target: Approver
    sourceCardinality: 0..*
    sourceName: documents
    sourceDescription: All documents for this approver.
    targetCardinality: 0..1
    targetName: approver
    targetDescription: Approver of this document.
  - source: Document
    target: Author
    sourceCardinality: 0..*
    sourceName: documents
    sourceDescription: All documents of this this author.
    targetCardinality: 0..1
    targetName: author
    targetDescription: Author of this document.
  - source: Document
    target: ConfigurationEvent
    sourceCardinality: 0..1
    sourceName: changedDocument
    sourceDescription: Document whose change resulted in this configuration event.
    targetCardinality: 0..*
    targetName: configurationEvents
    targetDescription: All configuration events created for this document.
  - source: Document
    target: Editor
    sourceCardinality: 0..*
    sourceName: documents
    sourceDescription: All documents for this editor.
    targetCardinality: 0..1
    targetName: editor
    targetDescription: Editor of this document.
  - source: Document
    target: Issuer
    sourceCardinality: 0..*
    sourceName: documents
    sourceDescription: All documents for this issuer.
    targetCardinality: 0..1
    targetName: issuer
    targetDescription: Issuer of this document.
