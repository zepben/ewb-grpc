name: Crew
description: Group of people with specific skills, tools, and vehicles.
attributes:
  - name: status
    type: Status
    description: Status of this crew.
ancestors:
  - IdentifiedObject
descendants:
  - OldCrew
associations:
  - source: Crew
    target: CrewMember
    sourceCardinality: 0..1
    sourceName: crew
    sourceDescription: Crew to which this crew member belongs.
    targetCardinality: 0..*
    targetName: crewMembers
    targetDescription: All members of this crew.
  - source: Crew
    target: CrewType
    sourceCardinality: 0..*
    sourceName: crews
    sourceDescription: All crews of this type.
    targetCardinality: 0..1
    targetName: crewType
    targetDescription: Type of this crew.
  - source: Crew
    target: FieldDispatchHistory
    sourceCardinality: 0..1
    sourceName: crew
    sourceDescription: The crew that has this field dispatch history.
    targetCardinality: 0..*
    targetName: fieldDispatchHistory
    targetDescription: The dispatch history associated with the crew.
  - source: Crew
    target: Location
    sourceCardinality: 0..*
    sourceName: crew
    sourceDescription: The crew that is assigned to this location.
    targetCardinality: 0..1
    targetName: location
    targetDescription: The location this crew is assigned to.
  - source: Crew
    target: Outage
    sourceCardinality: 0..*
    sourceName: crew
    sourceDescription: The crew that is assigned to the outage.
    targetCardinality: 0..*
    targetName: outage
    targetDescription: The outage that is assigned to the crew.
  - source: Crew
    target: SwitchingAction
    sourceCardinality: 0..*
    sourceName: crew
    sourceDescription: The crew that is assigned to the switching action.
    targetCardinality: "1"
    targetName: switchingAction
    targetDescription: The switching action that is assigned to this crew.
  - source: Crew
    target: WorkAsset
    sourceCardinality: 0..1
    sourceName: crew
    sourceDescription: Crew using this work asset.
    targetCardinality: 0..*
    targetName: workAssets
    targetDescription: All work assets used by this crew.
  - source: Crew
    target: WorkTask
    sourceCardinality: 0..*
    sourceName: crews
    sourceDescription: All crews participating in this work task.
    targetCardinality: 0..*
    targetName: workTasks
    targetDescription: All work tasks this crew participates in.
