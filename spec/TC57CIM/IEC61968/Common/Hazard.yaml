name: Hazard
description: An object or a condition that is a danger for causing loss or perils to an asset and/or people.
attributes:
  - name: status
    type: Status
    description: Status of this hazard.
  - name: type
    type: String
    description: Type of this hazard.
ancestors:
  - IdentifiedObject
descendants:
  - AssetLocationHazard
  - IncidentHazard
associations:
  - source: Hazard
    target: Incident
    sourceCardinality: 0..*
    sourceName: hazard
    targetCardinality: 0..1
    targetName: incident
  - source: Hazard
    target: TroubleTicket
    sourceCardinality: 0..*
    sourceName: hazard
    targetCardinality: 0..1
    targetName: troubleTicket
