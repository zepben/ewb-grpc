name: IEC61968CIMVersion
description: IEC 61968 version number assigned to this UML model.
attributes:
- name: date
  type: Date
  description: (const=2016-10-31) Form is YYYY-MM-DD for example for January 5, 2009 it is 2009-01-05.
- name: version
  type: String
  description: (const=IEC61968CIM13v09) Form is IEC61968CIMXXvYY where XX is the major CIM package version and the YY is the
    minor version. For example IEC61968CIM10v17.