name: TempEquipActionKind
type: enum
description: Kind of action on temporary equipment (such as cut, jumper, ground, energy source).
attributes:
  - name: connect
    type: enum
    description: Connect the temp equipment to its terminal
  - name: disconnect
    type: enum
    description: Disconnect the temp equipment from its terminal
  - name: place
    type: enum
    description: Place the jumper (close) or the cut (open).
  - name: remove
    type: enum
    description: Remove the jumper (open) or the cut (close).
