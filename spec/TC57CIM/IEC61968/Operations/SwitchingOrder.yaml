name: SwitchingOrder
description: Transmits a switching plan to a crew in order for the plan to be executed.
attributes:
  - name: comment
    type: String
    description: Free-form comment associated with the switching order.
  - name: plannedExecutionInterval
    type: DateTimeInterval
    description: The planned start and end time for the switching order.
ancestors:
  - Document
associations:
  - source: SwitchingOrder
    target: Location
    sourceCardinality: 0..1
    sourceName: switchingOrder
    sourceDescription: The switching order at this location.
    targetCardinality: 0..*
    targetName: location
    targetDescription: Location of this switching order.
  - source: SwitchingOrder
    target: SwitchingPlan
    sourceCardinality: 0..1
    sourceName: switchingOrder
    sourceDescription: The switching order that specified the switching plan to be implemented.
    targetCardinality: 0..1
    targetName: switchingPlan
    targetDescription: The switching plan that is defined in the switching order.
