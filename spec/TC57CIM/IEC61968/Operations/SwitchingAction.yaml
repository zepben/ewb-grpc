name: SwitchingAction
description: Atomic switching action.
attributes:
  - name: executedDateTime
    type: DateTime
    description: Actual date and time of this switching step.
  - name: issuedDateTime
    type: DateTime
    description: >-
      Date and time when the crew was given the instruction to execute the action; not applicable if the action is
      performed by operator remote control.
  - name: phases
    type: PhaseCode
    description: Phases of the Switching Action
  - name: plannedDateTime
    type: DateTime
    description: Planned date and time of this switching step.
ancestors:
  - IdentifiedObject
descendants:
  - ClampAction
  - ClearanceAction
  - ControlAction
  - CutAction
  - EnergyConsumerAction
  - EnergySourceAction
  - GenericAction
  - GroundAction
  - JumperAction
  - MeasurementAction
  - ShuntCompensatorAction
  - SwitchAction
  - TagAction
  - VerificationAction
associations:
  - source: SwitchingAction
    target: Crew
    sourceCardinality: "1"
    sourceName: switchingAction
    sourceDescription: The switching action that is assigned to this crew.
    targetCardinality: 0..*
    targetName: crew
    targetDescription: The crew that is assigned to the switching action.
  - source: SwitchingAction
    target: Operator
    sourceCardinality: 0..*
    sourceName: switchingSteps
    sourceDescription: All switching steps this operator is responsible for.
    targetCardinality: 0..1
    targetName: operator
    targetDescription: Operator responsible for this switching step.
  - source: SwitchingAction
    target: SwitchingEvent
    sourceCardinality: "1"
    sourceName: switchingAction
    sourceDescription: The switching action that is performed on the switching event
    targetCardinality: 0..1
    targetName: switchingEvent
    targetDescription: The switching event that the switching action is performed on
  - source: SwitchingAction
    target: SwitchingPlan
    sourceCardinality: 0..*
    sourceName: switchingAction
    sourceDescription: The switching actions that are associated with the switching plan.
    targetCardinality: 0..1
    targetName: switchingPlan
    targetDescription: The switching plan that is associated with the switching actions.
  - source: SwitchingAction
    target: SwitchingStep
    sourceCardinality: "1"
    sourceName: switchingAction
    sourceDescription: The switching action that is associated to the switching step.
    targetCardinality: 0..1
    targetName: switchingStep
    targetDescription: The switching step that is associated to the switching action.
