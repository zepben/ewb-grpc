name: ERTConfidenceKind
type: enum
description: >-
  The estimated restoration time (ERT) is the amount of time estimated to correct the outage and can have a confidence
  factor applied such as high or low confidence that the ERT will be accomplished.  This confidence factor may be
  updated as needed during the outage period - just as the actual ERT can be updated.
attributes:
  - name: high
    type: enum
    description: there is a high confidence that the ERT will be accomplished
  - name: low
    type: enum
    description: there is a low confidence that the ERT will be accomplished.
