name: OutageArea
description: This defines the area covered by the Outage.
attributes:
  - name: earliestReportedTime
    type: DateTime
    description: This is the reported time of the first outage report
  - name: metersServed
    type: Integer
    description: defines the number of meters served in the defined area.
  - name: outageAreaKind
    type: AreaKind
    description: defines the type of area that has the outage - county, state, zipcode, etc.
associations:
  - source: OutageArea
    target: Outage
    sourceCardinality: 0..*
    sourceName: outageArea
    sourceDescription: The outage area where the outage occurred.
    targetCardinality: 0..*
    targetName: outage
    targetDescription: The outage associated with the outage area.
