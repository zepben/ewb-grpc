name: EstimatedRestorationTime
description: The Estimated Restoration Time (ERT) for a single outage
attributes:
  - name: confidenceKind
    type: ERTConfidenceKind
    description: >-
      provides the confidence level that this ERT can be accomplished.  This may be changed/updated as needed.
  - name: ert
    type: DateTime
    description: estimated time the outage will be restored
  - name: ertSource
    type: String
    description: defines the source that provided the ERT value.
associations:
  - source: EstimatedRestorationTime
    target: Outage
    sourceCardinality: 0..1
    sourceName: estimatedRestorationTime
    sourceDescription: The estimated time that the power will be restored after an outage
    targetCardinality: 0..*
    targetName: outage
    targetDescription: The outage associated with the estimated time the power will be restored.
