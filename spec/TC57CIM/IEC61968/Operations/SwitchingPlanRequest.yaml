name: SwitchingPlanRequest
description: A document used to request that a switching plan be created for a particular purpose.
attributes:
  - name: comment
    type: String
    description: Free-form text to describe the request
  - name: equipmentToBeIsolated
    type: String
    description: free-form list of the equipment to be isolated by the switching
  - name: forwardSwitchingDateTimeInterval
    type: DateTimeInterval
    description: The date when the switching to isolate equipment is performed.
  - name: groundingPoints
    type: String
    description: >-
      free-form list of equipment to be grounded or other actions to be taken in order to accomplish the required
      grounding.
  - name: isolationArea
    type: String
    description: free-form description of the area to be isolated by the switching
  - name: isolationPoints
    type: String
    description: >-
      free-form list of equipment to be operated or other actions to be taken in order to accomplish the required
      isolation.
  - name: outageDateTimeInterval
    type: DateTimeInterval
    description: >-
      The window of time during which one or more customers will be de-energized during execution of the switching plan.
  - name: purpose
    type: String
    description: The purpose of this switching plan request.
  - name: reverseSwitchingDateTimeInterval
    type: DateTimeInterval
    description: The date when the switching to energize equipment is performed.
  - name: switchingRequestDetails
    type: String
    description: The details of this switching plan request.
ancestors:
  - Document
associations:
  - source: SwitchingPlanRequest
    target: Organisation
    sourceCardinality: 0..*
    sourceName: switchingPlanRequest
    sourceDescription: The switching plan requested by the requesting organization
    targetCardinality: 0..1
    targetName: requestingOrganization
    targetDescription: The organization that requested the switching plan.
  - source: SwitchingPlanRequest
    target: SwitchingPlan
    sourceCardinality: 0..1
    sourceName: switchingPlanRequest
    sourceDescription: The request for the specified switching plan.
    targetCardinality: 0..*
    targetName: switchingPlan
    targetDescription: The switching plan for the request.
