name: OilAnalysisPaperAnalogKind
type: enum
description: Analogs representing oil paper degradation analysis result.
attributes:
  - name: acetylfuran
    type: enum
    description: >-
      2-acetylfuran (2ACF) (in ppb). Also known as: 2-acetylfuran, furyl methyl ketone, 2-furyl methyl ketone, methyl
      2-furyl ketone, and 1-(2-furanyl)ethanone.
  - name: degreeOfPolymerization
    type: enum
    description: Direct measurement of degree of polymerization (DP) (unitless).
  - name: degreeOfPolymerizationCalculated
    type: enum
    description: Calculated degree of polymerization (DP) calculated using the Chendong equation (unitless).
  - name: ethanol
    type: enum
    description: Concentration of ethanol (in ppb, specifically microgram/kilogram).
  - name: furfural
    type: enum
    description: >-
      2-furaldehyde (2FAL) (in ppb). Also known as: 2-furfural, 2-furaldehyde, 2-furanaldehyde, fural, furfuraldehyde,
      furaldehyde, and 2-furancarboxaldehyde.
  - name: furfurylAlcohol
    type: enum
    description: >-
      Furfuryl alcohol (2FOL) (in ppb). Also known as: 2-furyl alcohol, 2-furfurol, 2-furylmethanol,
      2-hydroxymethylfuran, 2-furancarbinol, furancarbinol, 2-furanmethanol, furanmethanol, furfural alcohol, and
      alpha-furylcarbinol.
  - name: hydroxymethylfurfural
    type: enum
    description: >-
      5-hydroxymethyl-2-furaldehyde (5H2F) (in ppb). Also known as: 5-hydroxymethyl-2-furfural,
      5-hydroxymethyl-2-furaldehyde, 5-hydroxymethylfurfuraldehyde, and 5-hydroxymethylfurfural.
  - name: methanol
    type: enum
    description: Concentration of methanol (in ppb, specifically microgram/kilogram).
  - name: methylfurfural
    type: enum
    description: >-
      5-methyl-2-furaldehyde (5M2F) (in ppb). Also known as: 5-methyl-2-furfural, 5-methyl-2-furaldehyde,
      5-methyl-2-furfuraldehyde, and 5-methylfurfural.
  - name: solidInsulationDielectricStrength
    type: enum
    description: Dielectric breakdown of solid electrical insulating materials (in kV).
  - name: tensileStrength
    type: enum
    description: Tensile strength (in kilonewtons/metre).
  - name: totalFuran
    type: enum
    description: >-
      Total furan (in ppb). Is the total of the concentrations of 5-hydroxymethyl-2-furaldehyde (5H2F), furfuryl alcohol
      (2FOL), 2-furaldehyde (2FAL), 2-acetylfuran (2ACF), 5-methyl-2-furaldehyde (5M2F).
