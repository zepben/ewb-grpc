name: OilAnalysisFluidAnalogKind
type: enum
description: Analogs representing oil fluid test analysis result.
attributes:
  - name: acidNumber
    type: enum
    description: Acid neutralization number (in milligram of KOH/gram).
  - name: additiveDBDS
    type: enum
    description: Dibenzyl disulfide (DBDS) concentration (in ppm, specificially in milligram/kilogram).
  - name: aromatics
    type: enum
    description: Concentration of aromatic compounds determined using infrared spectroscopy (in percent).
  - name: carbonyl
    type: enum
    description: >-
      Concentration of carbonyl compounds (aldehydes and ketones) determined using infrared spectroscopy (in percent).
  - name: density
    type: enum
    description: Density (in gram/millilitre).
  - name: dielectricBreakdown
    type: enum
    description: Dielectric breakdown, for electrode gap size and temperature specified by selected standard  (in kV).
  - name: dissipationFactor
    type: enum
    description: >-
      Fluid dissipation factor in absolute value, not a percentage. (Multiplying this value by 100 would result in
      dissipation factor percent).
  - name: dissipationFactorPercent
    type: enum
    description: >-
      Fluid dissipation factor (in percent). Commonly used in Asia. Dissipation factor is also known as loss factor or
      tan delta.
  - name: duration61125MethodC
    type: enum
    description: >-
      Duration of oxidation stablity test performed according to IEC 61125, method C. This value should accompany values
      resulting from testing according to IEC 61125, method C to allow interpretation. Standard specified values are:
      164, 332, and 500, but others can be used if agreed upon.
  - name: firePoint
    type: enum
    description: >-
      Fire point (in °C). Fire point is when fire is sustained (oil catches fire). Can only be done by means of open cup
      test, which is commonly used in US.
  - name: flashPointClosedCup
    type: enum
    description: >-
      Flash point (in °C) determined via closed cup test. Flash point occurs when enough vapors have accumulated to
      sustain a flash. Closed cup is used in Europe.
  - name: flashPointOpenCup
    type: enum
    description: >-
      Flash point (in °C) determined via open cup test. Flash point occurs when enough vapors have accumulated to
      sustain a flash. Open cup is used in US.
  - name: inductionTime
    type: enum
    description: Oxidation induction time (in hours). Typically performed on new oil,but can be done on used oil.
  - name: inhibitor61125MethodC
    type: enum
    description: >-
      Amount of inhibitor used in oxidation stablity test performed according to IEC 61125, method C. This value should
      accompany values resulting from testing according to IEC 61125, method  C to allow interpretation.
  - name: interfacialTension
    type: enum
    description: Interfacial tension (in dyne/centimetre or milliNewton/metre, which are the same).
  - name: kinematicViscosity
    type: enum
    description: >-
      Kinematic viscosity (in millimetre2/second). Kinematic viscosity is the ratio of - absolute (or dynamic) viscosity
      to density.
  - name: oxidation
    type: enum
    description: Measure of oxidation stability (in hours).
  - name: oxidationInhibitorD2668
    type: enum
    description: 2,6-ditertiary-butyl para-cresol and 2,6-ditertiary-butyl phenol concentration (in percent by weight).
  - name: oxidationInhibitorDBP
    type: enum
    description: 2,6-ditertiary-butyl phenol (DBP) oxidation inhibitor concentration (in percent by weight).
  - name: oxidationInhibitorDBPC
    type: enum
    description: 2,6-ditertiarybutyl para-cresol (DBPC) oxidation inhibitor concentration (in percent by weight).
  - name: passivatorBTA
    type: enum
    description: Metal passivator BTA content (in milligram/kilogram).
  - name: passivatorContent
    type: enum
    description: Total passivator content (in milligram/kilogram).
  - name: passivatorIrgamet39
    type: enum
    description: Irgamet 39 metal passivator content (in ppm, specifically milligram/kilogram).
  - name: passivatorTTA
    type: enum
    description: Metal passivator TTA (Irgamet39 in solid form) content (in milligram/kilogram).
  - name: petroleumOrigin
    type: enum
    description: Characterization of the carbon-type composition of insulating oils by petroleum origin.
  - name: pourPoint
    type: enum
    description: >-
      Pour point (in °C). The pour point of a liquid is the temperature at which it becomes semi solid and loses its
      flow characteristics.
  - name: pourPointAutomatic
    type: enum
    description: >-
      Pour point (in °C) determined by automatic method. The pour point of a liquid is the temperature at which it
      becomes semi solid and loses its flow characteristics.
  - name: powerFactorPercent
    type: enum
    description: >-
      Fluid power factor at specified temperature (in percent). Commonly used in US. (Note: Fluid power factor is very
      similar to fluid dissapation factor, but fluid power factor is cosine of the phase angle between an AC voltage
      applied to oil and the resulting current (where dissipation factor is the tangent). For values up to 0.005, fluid
      power factor and dissapation factor are very close. There is a conversion equation between the two).
  - name: resistivity
    type: enum
    description: Resistivity at 90°C (in gigohm-metre).
  - name: sedimentAndSludgePercent
    type: enum
    description: Sediment and sludge (in percent).
  - name: sludge
    type: enum
    description: Sludge (in percent by mass). Typically performed on new oil,but can be done on used oil.
  - name: solubleAcids
    type: enum
    description: Soluble acids  (in milligram of KOH/gram). Typically performed on new oil,but can be done on used oil.
  - name: specificGravity
    type: enum
    description: >-
      Specific gravity corrected to 15°C. Also known as relative density. It is a ratio of density of tested oil to
      density of water at a specific temperature.
  - name: staticElectrification
    type: enum
    description: >-
      Static electrification tendency (in microcoulombs per metre3). Also called static charging tendency and
      electrostatic charging tendency (ECT).
  - name: totalAcids
    type: enum
    description: >-
      Total acids (soluble plus volatile) (in milligram of KOH/gram). Typically performed on new oil,but can be done on
      used oil.
  - name: volatileAcids
    type: enum
    description: Volatile acids (in milligram of KOH/gram). Typically performed on new oil,but can be done on used oil.
