name: EndDeviceFunctionKind
type: enum
description: Kind of end device function.
attributes:
  - name: autonomousDst
    type: enum
    description: Autonomous application of daylight saving time (DST).
  - name: demandResponse
    type: enum
    description: Demand response functions.
  - name: electricMetering
    type: enum
    description: Electricity metering.
  - name: gasMetering
    type: enum
    description: Gas metering.
  - name: metrology
    type: enum
    description: Presentation of metered values to a user or another system (always a function of a meter, but might not be supported by a load control unit).
  - name: onRequestRead
    type: enum
    description: On-request reads.
  - name: outageHistory
    type: enum
    description: Reporting historical power interruption data.
  - name: relaysProgramming
    type: enum
    description: Support for one or more relays that may be programmable in the meter (and tied to TOU, time pulse, load control or other functions).
  - name: reverseFlow
    type: enum
    description: Detection and monitoring of reverse flow.
  - name: waterMetering
    type: enum
    description: Water metering.
