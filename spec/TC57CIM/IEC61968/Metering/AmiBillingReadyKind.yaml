name: AmiBillingReadyKind
type: enum
description: Lifecycle states of the metering installation at a usage point with respect to readiness for billing via advanced metering infrastructure reads.
attributes:
  - name: amiCapable
    type: enum
    description: Usage point is equipped with an AMI capable meter that is not yet currently equipped with a communications module.
  - name: amiDisabled
    type: enum
    description: Usage point is equipped with an AMI capable meter; however, the AMI functionality has been disabled or is not being used.
  - name: billingApproved
    type: enum
    description: Usage point is equipped with an operating AMI capable meter and accuracy has been certified for billing purposes.
  - name: enabled
    type: enum
    description: Usage point is equipped with an AMI capable meter having communications capability.
  - name: nonAmi
    type: enum
    description: Usage point is equipped with a non AMI capable meter.
  - name: nonMetered
    type: enum
    description: Usage point is not currently equipped with a meter.
  - name: operable
    type: enum
    description: Usage point is equipped with an AMI capable meter that is functioning and communicating with the AMI network.
