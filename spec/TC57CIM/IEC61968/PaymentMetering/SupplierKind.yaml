name: SupplierKind
type: enum
description: Kind of supplier.
attributes:
  - name: lse
    type: enum
    description: Load Serving Entity
  - name: mdma
    type: enum
    description: >-
      Meter Data Management Agent (MDMA) reads meters, validates meter data, and estimates missing data to be used in
      various applications
  - name: msp
    type: enum
    description: >-
      Managed service provider (MSP) delivers services, such as network, application, infrastructure and security, via
      ongoing and regular support and active administration
  - name: other
    type: enum
    description: Other kind of supplier.
  - name: retailer
    type: enum
    description: >-
      Entity that sells the service, but does not deliver to the customer; applies to the deregulated markets.
  - name: utility
    type: enum
    description: Entity that delivers the service to the customer.
