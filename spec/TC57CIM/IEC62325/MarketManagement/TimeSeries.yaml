name: TimeSeries
description: A set of regular time-ordered measurements or values of quantitative nature of an individual or collective phenomenon
  taken at successive, in most cases equidistant, periods / points of time.
attributes:
- name: businessType
  type: String
  description: The identification of the nature of the time series.
- name: cancelledTS
  type: String
  description: An indicator stating that the TimeSeries, identified by the mRID, is cancelled as well as all the values sent
    in a previous version of the TimeSeries in a previous document.
- name: curveType
  type: String
  description: The coded representation of the type of curve being described.
- name: objectAggregation
  type: String
  description: Identification of the object that is the common denominator used to aggregate a time series.
- name: product
  type: String
  description: The type of the product such as Power, energy, reactive power, transport capacity that is the subject of the
    time series.
- name: version
  type: String
  description: Version of the time series.
ancestors:
- IdentifiedObject
descendants:
- BidTimeSeries
- Series
