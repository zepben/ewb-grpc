name: UncertaintyKind
type: enum
description: The type of uncertainty for a reading.
attributes:
- name: estimated
  type: enum
  description: The value is estimated.
- name: interpolated
  type: enum
  description: The value is interpolated.
- name: standard
  type: enum
  description: The value has standard uncertainty consistent with National Weather Service practises given the instrument
    and manner of observation.
- name: unknown
  type: enum
  description: The process of value calculation or measurement is unknown.
