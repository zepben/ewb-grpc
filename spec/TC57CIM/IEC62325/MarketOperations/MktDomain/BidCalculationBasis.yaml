name: BidCalculationBasis
type: enum
description: The basis used to calculate the bid price curve for an energy default bid.
attributes:
- name: COST_BASED
  type: enum
  description: Based on unit generation characteristics and a cost of fuel.
- name: LMP_BASED
  type: enum
  description: Based on prices paid at particular pricing location.
- name: NEGOTIATED
  type: enum
  description: An amount negotiated with the designated Independent Entity.
