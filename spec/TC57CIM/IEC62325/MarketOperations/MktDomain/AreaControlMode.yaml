name: AreaControlMode
type: enum
description: Area's present control mode.
attributes:
  - name: CF
    type: enum
    description: CF = Constant Frequency
  - name: CTL
    type: enum
    description: Constant Tie-Line
  - name: "OFF"
    type: enum
    description: Off control
  - name: TLB
    type: enum
    description: Tie-Line Bias
