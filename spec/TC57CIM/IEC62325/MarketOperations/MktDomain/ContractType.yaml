name: ContractType
type: enum
description: >-
  Transmission Contract Type, For example:

  O - Other

  TE - Transmission Export

  TI - Transmission Import

  ETC - Existing Transmission Contract

  RMT - RMT Contract

  TOR - Transmission Ownership Right

  RMR - Reliability Must Run Contract

  CVR - Converted contract
attributes:
  - name: CVR
    type: enum
    description: CVR - Converted contract.
  - name: ETC
    type: enum
    description: ETC - Existing Transmission Contract
  - name: O
    type: enum
    description: O - Other
  - name: RMR
    type: enum
    description: RMR - Reliability Must Run Contract
  - name: RMT
    type: enum
    description: RMT - RMT Contract
  - name: TE
    type: enum
    description: TE - Transmission Export
  - name: TI
    type: enum
    description: TI - Transmission Import
  - name: TOR
    type: enum
    description: TOR - Transmission Ownership Right
