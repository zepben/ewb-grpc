name: MarketProductType
type: enum
description: >-
  For example:

  Energy, Reg Up, Reg Down, Spin Reserve, Nonspin Reserve, RUC, Load Folloing Up, and Load Following Down.
attributes:
  - name: EN
    type: enum
    description: energy type
  - name: LFD
    type: enum
    description: Load following down
  - name: LFU
    type: enum
    description: Load following up
  - name: NR
    type: enum
    description: non spinning reserve
  - name: RC
    type: enum
    description: Residual Unit Commitment
  - name: RD
    type: enum
    description: regulation down
  - name: REG
    type: enum
    description: Regulation
  - name: RU
    type: enum
    description: regulation up
  - name: SR
    type: enum
    description: spinning reserve
