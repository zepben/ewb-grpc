name: CRRSegmentType
type: enum
description: Type of the CRR, from the possible type definitions in the CRR System (e.g. 'LSE', 'ETC').
attributes:
  - name: AUC
    type: enum
  - name: CAP
    type: enum
  - name: CF
    type: enum
  - name: CVR
    type: enum
    description: Converted rights.
  - name: ETC
    type: enum
    description: Existing Transmission Contract.
  - name: LSE
    type: enum
    description: Load Serving Entity.
  - name: MT
    type: enum
    description: Merchant transmission.
  - name: TOR
    type: enum
    description: Transmission Ownership Rights.
