name: RampCurveType
type: enum
description: >-
  For example:

  0 - Fixed ramp rate independent of rate function unit MW output

  1 - Static ramp rates as a function of unit MW output only

  2 - Dynamic ramp rates as a function of unit MW output and ramping time
attributes:
  - name: "0"
    type: enum
    description: Fixed ramp rate independent of rate function unit MW output
  - name: "1"
    type: enum
    description: Static ramp rates as a function of unit MW output only
  - name: "2"
    type: enum
    description: Dynamic ramp rates as a function of unit MW output and ramping time
