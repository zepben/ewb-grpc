name: MktContingency
description: Subclass of IEC 61970:Contingency.
attributes:
  - name: loadRolloverFlag
    type: Boolean
    description: >-
      load change flag

      Flag that indicates whether load rollover and load pickup should be processed for this contingency
  - name: ltcControlFlag
    type: Boolean
    description: >-
      ltc enable flag

      Flag that indicates if LTCs regulate voltage during the solution of the contingency
  - name: participationFactorSet
    type: String
    description: >-
      Participation Factor flag

      An indication which set of generator participation factors should be used to re-allocate generation in this
      contingency
  - name: screeningFlag
    type: Boolean
    description: >-
      sceening flag for outage

      Flag that indicated whether screening is bypassed for the contingency
ancestors:
  - Contingency
associations:
  - source: MktContingency
    target: ConstraintResults
    sourceCardinality: "1"
    sourceName: mktContingency
    targetCardinality: 0..*
    targetName: constraintResults
  - source: MktContingency
    target: ContingencyConstraintLimit
    sourceCardinality: "1"
    sourceName: mktContingency
    targetCardinality: 0..*
    targetName: contingencyConstraintLimit
  - source: MktContingency
    target: TransferInterfaceSolution
    sourceCardinality: 0..1
    sourceName: mktContingencyA
    targetCardinality: 0..1
    targetName: transferInterfaceSolutionA
  - source: MktContingency
    target: TransferInterfaceSolution
    sourceCardinality: 0..1
    sourceName: mktContingencyB
    targetCardinality: 0..1
    targetName: transferInterfaceSolutionB
