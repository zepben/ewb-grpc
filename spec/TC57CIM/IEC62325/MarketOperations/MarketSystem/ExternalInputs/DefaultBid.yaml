name: DefaultBid
description: >-
  DefaultBid is a generic class to hold Default Energy Bid, Default Startup Bid, and Default Minimum Load Bid:


  Default Energy Bid

  A Default Energy Bid is a monotonically increasing staircase function consisting at maximum 10 economic bid segments,
  or 10 ($/MW, MW) pairs. There are three methods for determining the Default Energy Bid:

  <ul>
  	<li>Cost Based: derived from the Heat Rate or Average Cost multiplied by the Gas Price Index plus 10%.</li>
  	<li>LMP Based: a weighted average of LMPs in the preceding 90 days.</li>
  	<li>Negotiated: an amount negotiated with the designated Independent Entity.</li>
  </ul>


  Default Startup Bid

  A Default Startup Bid (DSUB) shall be calculated for each RMR unit based on the Startup Cost stored in the Master File
  and the applicable GPI and EPI.


  Default Minimum Load Bid

  A Default Minimum Load Bid (DMLB) shall be calculated for each RMR unit based on the Minimum Load Cost stored in the
  Master File and the applicable GPI.
attributes:
  - name: bidType
    type: BidType
    description: Default bid type such as Default Energy Bid, Default Minimum Load Bid, and Default Startup Bid
  - name: minLoadCost
    type: CostRate
    description: Minimum load cost in $/hr
  - name: peakFlag
    type: OnOff
    description: on-peak, off-peak, or all
ancestors:
  - Bid
associations:
  - source: DefaultBid
    target: DefaultBidCurve
    sourceCardinality: 0..1
    sourceName: defaultBid
    targetCardinality: 0..1
    targetName: defaultBidCurve
  - source: DefaultBid
    target: RegisteredResource
    sourceCardinality: 0..1
    sourceName: defaultBid
    targetCardinality: "1"
    targetName: registeredResource
