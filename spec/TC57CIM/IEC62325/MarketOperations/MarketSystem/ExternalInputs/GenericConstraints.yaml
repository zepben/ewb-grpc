name: GenericConstraints
description: >-
  Generic constraints can represent secure areas, voltage profile, transient stability and voltage collapse limits.


  The generic constraints can be one of the following forms:

  a)	Thermal MW limit constraints type

  b)	Group line flow constraint type
attributes:
  - name: intervalEndTime
    type: DateTime
    description: Interval End Time
  - name: intervalStartTime
    type: DateTime
    description: Interval Start Time
  - name: maxLimit
    type: Float
    description: Maximum Limit (MW)
  - name: minLimit
    type: Float
    description: Minimum Limit (MW)
ancestors:
  - IdentifiedObject
associations:
  - source: GenericConstraints
    target: Flowgate
    sourceCardinality: 0..1
    sourceName: genericConstraints
    targetCardinality: 0..*
    targetName: flowgate
  - source: GenericConstraints
    target: TransmissionCapacity
    sourceCardinality: 0..1
    sourceName: genericConstraints
    targetCardinality: 0..*
    targetName: transmissionCapacity
