  sourceName: securityConstraints
  targetCardinality: 0..1
  targetName: rTO
- source: SecurityConstraints
  target: GeneratingBid
  sourceCardinality: 0..*
  sourceName: securityConstraints
  targetCardinality: 0..1
  targetName: generatingBid
- source: SecurityConstraints
  target: Flowgate
  sourceCardinality: 0..1
  sourceName: securityConstraints
  targetCardinality: 0..1
  targetName: flowgate