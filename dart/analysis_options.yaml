analyzer:
  errors:
    # protoc_plugin always emits dart:async for empty services.
    unused_import: ignore
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - unawaited_futures
