name: Build

on: 
  pull_request:
  workflow_dispatch:

jobs:
  licence-and-protolock-check:
    runs-on: ubuntu-latest
    container: zepben/pipeline-basic
    steps:
      - uses: actions/checkout@v4

      - run: |
          apk add --no-cache tar

      - name: Cache licence-check
        uses: actions/cache@v4
        with:
          path: /lc
          key: lcc

      - name: Cache protolock
        uses: actions/cache@v4
        with:
          path: /protolock
          key: pbc

      - name: Check licence
        uses: zepben/licence-check-action@main
        with:
          LC_URL: ${{ secrets.LC_URL }}
          PATH: proto

      - name: Check protolock
        uses: zepben/protolock-action@main
        with:
          PATH: proto/zepben

  java-build:
    needs: licence-and-protolock-check
    container: zepben/pipeline-java-ewb:17-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache maven deps
        uses: actions/cache@v4
        with:
          path: /maven
          key: maven

      - name: Build Java
        run: |
          cd java
          mvn clean package -f pom.xml -Dgpg.keyname=
        shell: bash

  python-build:
    needs: licence-and-protolock-check
    container: python:3.10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache python deps
        uses: actions/cache@v4
        with:
          path: /pipcache
          key: pip

      - name: Build Python
        run: |
          cd python
          mkdir -p /pipcache
          pip install --cache-dir /pipcache -r requirements.txt
          python build.py --fullclean
          python build.py --package

  dart-build:
    needs: licence-and-protolock-check
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        sdk: ['3.8.3', stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libprotobuf-dev

      - name: Build
        run: |
          cd dart
          ./build.sh
          dart analyze --fatal-infos
